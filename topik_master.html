function renderMatch(){$('card').classList.add('hidden');$('matchArea').classList.remove('hidden');['flashBtns','learnBtns','testBtns'].forEach(k=>$(k).classList.add('hidden'));$('matchProgress').textContent=`BỘ ${set+1} · Chọn cặp từ tương ứng`;$('matchScore').textContent=`${matchDone.size}/${matchPairs.length}`;$('matchKo').innerHTML='';$('matchVi').innerHTML='';matchKoOrder.forEach(p=>{const b=document.createElement('button');b.className='match-choice'+(matchDone.has(p.key)?' done':'')+(matchKoPick===p.key?' selected':'');b.textContent=p.ko;b.disabled=matchDone.has(p.key)||matchLock;b.onclick=()=>{if(matchDone.has(p.key)||matchLock)return;matchKoPick=p.key;checkMatchPick();renderMatch()};$('matchKo').appendChild(b)});matchViOrder.forEach(p=>{const b=document.createElement('button');b.className='match-choice'+(matchDone.has(p.key)?' done':'')+(matchViPick===p.key?' selected':'');b.textContent=p.vi;b.disabled=matchDone.has(p.key)||matchLock;b.onclick=()=>{if(matchDone.has(p.key)||matchLock)return;matchViPick=p.key;checkMatchPick();renderMatch()};$('matchVi').appendChild(b)});$('matchMessage').textContent=matchDone.size===matchPairs.length&&matchPairs.length?'🎉 Chính xác! Bạn đã ghép đủ tất cả các cặp.':(matchMessage||'Chọn một từ tiếng Hàn và nghĩa tiếng Việt tương ứng.');$('matchRestart').textContent='Chơi lượt mới';updateProgressBoard()}
function checkMatchPick(){if(matchKoPick===null||matchViPick===null)return;if(matchKoPick===matchViPick){matchDone.add(matchKoPick);const pair=matchPairs.find(x=>x.key===matchKoPick);if(pair){savedProgress.matchDone[set]=savedProgress.matchDone[set]||{};savedProgress.matchDone[set][pair.wordId]=true;}saveMatchRound();matchMessage='✓ Chính xác!';matchKoPick=null;matchViPick=null}else{matchMessage='Chưa đúng, thử lại nhé.';matchLock=true;setTimeout(()=>{matchKoPick=null;matchViPick=null;matchLock=false;matchMessage='Hãy thử ghép cặp khác nhé.';renderMatch()},650)}}
$('matchRestart').onclick=()=>{newMatchRound();matchMessage='';saveMatchRound()};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{saveCurrentProgress();reviewMode=false;mode=b.dataset.mode;pool=range();pos=Math.max(0,Math.min(pool.length-1,Number(savedProgress.positions[setKey(mode,set)])||0));flipped=mode==='flash'&&!!savedProgress.flipped;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));if(mode==='match'){restoreMatchRound()}else{render()}saveCurrentProgress()});$('flip').onclick=()=>{flipped=!flipped;saveCurrentProgress();render()};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('nextQ').onclick=()=>move(1);$('skip').onclick=()=>{const n=id();wrong[n]=true;streaks[n]=0;testAnswered[n]=true;savedProgress.testAnswered=testAnswered;if(!reviewMode){savedProgress.testDone[set]=savedProgress.testDone[set]||{};savedProgress.testDone[set][n]=true;const sc=scores[set+1]||{correct:0,total:0};sc.total++;scores[set+1]=sc;localStorage.setItem('tm_scores',JSON.stringify(scores));}save();persistProgress();counts();updateProgressBoard();move(1)};$('yes').onclick=()=>{let n=id();savedProgress.learnDone[set]=savedProgress.learnDone[set]||{};savedProgress.learnDone[set][n]=true;streaks[n]=(streaks[n]||0)+1;if(streaks[n]>=2){known[n]=true;delete wrong[n]}save();persistProgress();updateProgressBoard();move(1)};$('dont').onclick=()=>{savedProgress.learnDone[set]=savedProgress.learnDone[set]||{};savedProgress.learnDone[set][id()]=true;wrong[id()]=true;streaks[id()]=0;save();persistProgress();updateProgressBoard();move(1)};function showList(which){let keys=Object.keys(which==='wrong'?wrong:known).map(Number);$('listPanel').classList.remove('hidden');$('listTitle').textContent=which==='wrong'?'Danh sách từ cần ôn':'Danh sách từ đã nhớ';$('listItems').innerHTML=keys.length?keys.map(n=>`<div><b>${DATA[n-1].ko}</b> — ${DATA[n-1].vi}</div>`).join(''):'Chưa có từ nào';} $('retryWrong').onclick=()=>{reviewIds=Object.keys(wrong).map(Number).sort((a,b)=>a-b);if(!reviewIds.length){$('listPanel').classList.remove('hidden');$('listTitle').textContent='Làm lại câu chưa thuộc';$('listItems').textContent='Bạn chưa có câu nào cần làm lại.';return}reviewMode=true;pool=reviewIds.map(n=>DATA[n-1]);pos=0;mode='test';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode==='test'));$('listPanel').classList.add('hidden');render()};$('wrongList').onclick=()=>showList('wrong');$('knownList').onclick=()=>showList('known');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('on',x===b));if(b.dataset.nav==='flash'){mode='flash';document.querySelector('[data-mode="flash"]').click()}else if(b.dataset.nav==='test'){document.querySelector('[data-mode="test"]').click()}else if(b.dataset.nav==='lists')showList('wrong');else{mode='flash';render()}});renderSets();document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));if(mode==='match')restoreMatchRound();else render();updateProgressBoard();window.addEventListener('pagehide',saveCurrentProgress);window.addEventListener('beforeunload',saveCurrentProgress);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveCurrentProgress()});
// Safari/iOS: bind the reset action with addEventListener after the page controls exist.
window.resetCurrentModeProgress = resetCurrentModeProgress;
const resetButton = document.getElementById('resetModeProgress');
if (resetButton) {
  resetButton.removeAttribute('onclick');
  resetButton.addEventListener('click', function(event) {
    event.preventDefault();
    event.stopPropagation();
    try {
      window.resetCurrentModeProgress();
    } catch (error) {
      console.error('Reset tiến trình thất bại:', error);
      // Fallback: always reset the visible position and progress indicator.
      pos = 0;
      flipped = false;
      reviewMode = false;
      pool = range();
      savedProgress.positions[setKey(mode, set)] = 0;
      try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(savedProgress)); } catch (_) {}
      if (mode === 'match') { restoreMatchRound(); }
      else { render(); updateProgressBoard(); }
    }
  }, false);
}
// Nút Reset gọi trực tiếp resetCurrentModeProgress() bằng onclick để tương thích Safari/iOS.
</script></body></html>
